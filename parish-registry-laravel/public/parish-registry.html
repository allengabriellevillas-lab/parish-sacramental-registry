    <style>
        body {
            font-family: 'Libre Franklin', sans-serif;
            background: #eefaff;
            color: #1a1f25;
        }

        .font-cert {
            font-family: 'Source Serif 4', serif;
        }

        /* Official diocesan seal used in the staff-workspace navigation. */
        a[href="/staff"] > span:first-child {
            background: #fff url('assets/diocese-of-dumaguete.jpg') center / cover no-repeat !important;
            color: transparent !important;
            font-size: 0 !important;
        }

        .field-label {
            font-size: 11px;
            letter-spacing: .02em;
            color: #667887;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            box-shadow: 0 0 0 3px #13bde844;
            border-color: #008fbe;
        }

        .tab.active {
            color: #008fbe;
            border-bottom: 2px solid #008fbe;
        }

        .seal {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ff9a3d, #f26a16 48%, #c9141b 72%);
            border: 3px solid #052c3b;
            display: grid;
            place-items: center;
            box-shadow: inset 0 0 0 4px #ffffff26;
        }

        .seal div {
            font: 11px/1.2 'Source Serif 4', serif;
            color: #1a1f25;
            text-align: center;
        }

        /* Staff sign-in screen. */
        .login-screen {
            min-height: 100vh;
            background: #fff;
        }

        .login-visual {
            min-height: 43vh;
            position: relative;
            overflow: hidden;
            background: #008fbe url('assets/9111fe70-fe2d-4e90-a610-68435670fdc4.jpg') center 42% / cover no-repeat;
        }

        .login-visual::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(5, 44, 59, .92), rgba(0, 143, 190, .55));
        }

        .login-visual-content {
            position: relative;
            z-index: 1;
        }

        .login-form-panel {
            min-height: 57vh;
        }

        .login-form-panel > div {
            max-width: 360px !important;
        }

        .login-form-panel > div > div:first-child > img,
        .login-form-panel > div > div:first-child > span {
            width: 76px;
            height: 76px;
        }

        .login-form-panel > div > div:first-child > span {
            display: none;
        }

        .login-form-panel > div > p:first-of-type,
        .login-form-panel label {
            font-size: 10px;
        }

        .login-form-panel form {
            margin-top: 1.75rem !important;
        }

        .login-input {
            height: 50px;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            font-size: 13px;
        }

        .login-input:focus {
            box-shadow: 0 0 0 3px rgba(19, 189, 232, .20);
            border-color: #008fbe;
        }

        .login-submit {
            background: #008fbe;
            box-shadow: 0 2px 5px rgba(5, 44, 59, .22);
        }

        .login-submit:hover,
        .login-submit:focus {
            background: #06455f;
        }

        .login-submit {
            font-size: 11px !important;
            padding-top: 14px !important;
            padding-bottom: 14px !important;
        }

        .login-form-panel > div > p:last-child {
            font-size: 9px;
        }

        /* Let the staff dashboard occupy all space beside the fixed sidebar. */
        #content {
            width: 100%;
            max-width: none !important;
        }

        @media (min-width: 768px) {
            .login-screen {
                display: grid;
                grid-template-columns: minmax(0, 2.2fr) minmax(360px, 1fr);
            }

            .login-visual,
            .login-form-panel {
                min-height: 100vh;
            }
        }

        :root { color-scheme: light dark; --page:#eef8fc; --surface:#fff; --border:#d9e8f0; --blue:#0289bf; --orange:#f26a12; --orange-text:#c4560a; --text:#12222d; --muted:#5d7080; --green:#1f8a52; --green-bg:#e2f5ea; }
        body { background:var(--page); color:var(--text); font-family:'Public Sans',sans-serif; }
        .font-cert,.greeting-banner h1,.stat-cell>b,.summary-tiles b { font-family:'Newsreader',serif; font-weight:600; }
        .staff-shell { min-height:100vh; display:grid; grid-template-columns:256px minmax(0,1fr); background:var(--page); color:var(--text); font-size:14px; }
        .staff-sidebar { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; background:var(--surface); border-right:1px solid var(--border); z-index:30; }
        .staff-brand { display:flex; align-items:center; gap:12px; padding:22px 20px; border-bottom:1px solid var(--border); color:var(--text); text-decoration:none; }
        .staff-brand b,.staff-brand small { display:block; }.staff-brand b { font-size:15px; }.staff-brand small { margin-top:3px; color:var(--muted); font-size:12px; }
        .staff-crest { display:grid; place-items:center; flex:none; width:42px;height:42px;border-radius:50%;background:var(--blue) url('assets/diocese-of-dumaguete.jpg') center/cover no-repeat;color:transparent;font-size:0;box-shadow:0 0 0 2px #0289bf33; }
        .staff-nav { display:grid; gap:5px; padding:14px 12px; }.staff-nav-link { min-width:0; display:flex; align-items:center; gap:12px; width:100%; padding:11px 12px; border:0;border-radius:8px;background:transparent;color:var(--text);text-decoration:none;text-align:left;font:600 13px 'Public Sans',sans-serif;cursor:pointer;transition:color .16s,border-color .16s,background-color .16s; }.staff-nav-link>span:first-child { display:grid;place-items:center;color:var(--blue); }.staff-nav-link:hover { background:var(--page); }.staff-nav-link.nav-active { background:var(--blue);color:#fff; }.staff-nav-link.nav-active>span:first-child { color:#fff; }.nav-count { margin-left:auto;padding:2px 7px;border-radius:99px;background:#fff0e8;color:var(--orange-text);font-size:11px; }
        .staff-sidebar-bottom { margin-top:auto;padding:12px;border-top:1px solid var(--border); }.logout-link,.staff-sidebar-bottom .logout-link { color:#b4232b; }
        .staff-workspace { min-width:0;min-height:100vh;display:flex;flex-direction:column; }.staff-topbar { position:sticky;top:0;z-index:20;min-height:76px;display:flex;align-items:center;gap:24px;padding:12px 24px;background:color-mix(in srgb,var(--page) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border); }.global-search { flex:1;max-width:560px; }.global-search label { display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--muted); }.global-search label>span { display:grid; }.global-search input { width:100%;height:42px;border:0;background:transparent;color:var(--text);font:14px 'Public Sans',sans-serif;outline:none; }.global-search kbd { padding:2px 7px;border:1px solid var(--border);border-radius:4px;font:12px 'Public Sans',sans-serif; }.topbar-actions { display:flex;align-items:center;gap:10px;margin-left:auto; }.new-record,.portal-button { min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1px solid var(--orange);border-radius:8px;font:600 13px 'Public Sans',sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;transition:color .16s,border-color .16s,background-color .16s; }.new-record { color:#fff;background:var(--orange); }.new-record:hover { background:#dc5c0b; }.portal-button { color:var(--text);background:var(--surface);border-color:var(--border); }.profile-wrap { position:relative; }.profile-chip { display:flex;align-items:center;gap:9px;padding:5px 9px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer; }.avatar-wrap { position:relative;display:grid; }.avatar-wrap>i { position:absolute;right:0;bottom:0;width:9px;height:9px;border:2px solid var(--surface);border-radius:50%;background:#20a263; }.profile-name b,.profile-name small { display:block;text-align:left; }.profile-name b { font-size:12px; }.profile-name small { margin-top:2px;color:var(--muted);font-size:11px; }.profile-menu { position:absolute;top:calc(100% + 9px);right:0;z-index:40;width:250px;padding:7px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px #102a3a22; }.profile-menu-head { display:grid;gap:4px;padding:10px;border-bottom:1px solid var(--border);margin-bottom:4px; }.profile-menu-head span { color:var(--muted);font-size:12px; }.profile-menu button { display:flex;align-items:center;gap:9px;width:100%;padding:10px;border:0;border-radius:6px;background:transparent;color:var(--text);text-align:left;cursor:pointer; }.profile-menu button:hover { background:var(--page); }.staff-content { width:100%;max-width:none!important;flex:1;min-height:0;padding:20px 24px 24px; }
        .dashboard-loading { min-height:340px;display:grid;place-items:center;color:var(--muted); }.dashboard-layout { min-height:calc(100vh - 124px);display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,26%);align-items:stretch;gap:22px; }.dashboard-main { min-width:0;display:flex;flex-direction:column;gap:16px; }.greeting-banner { overflow:hidden;padding:21px 24px 0;border-radius:14px;background:var(--blue);color:white; }.greeting-top { display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:19px; }.greeting-date { margin:0;color:#e2f5fb;font-size:13px; }.greeting-banner h1 { margin:7px 0 5px;font-size:clamp(30px,3vw,42px);line-height:1.13; }.greeting-copy { margin:0;color:#f0faff;font-size:13px;line-height:1.6; }.greeting-actions { display:flex;flex:none;gap:8px; }.greeting-actions button { padding:10px 13px;border:1px solid transparent;border-radius:7px;font:600 12px 'Public Sans',sans-serif;cursor:pointer; }.greeting-review { background:#fff;color:#026b95; }.greeting-search { color:#fff;background:#ffffff18;border-color:#ffffff55!important; }.greeting-facts { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:13px 0 15px;border-top:1px solid #ffffff50; }.greeting-facts div { min-width:0; }.greeting-facts small,.greeting-facts b { display:block; }.greeting-facts small { margin-bottom:4px;color:#dff5fc;font-size:11px; }.greeting-facts b { overflow:hidden;color:white;font-size:12px;font-weight:600;text-overflow:ellipsis;white-space:nowrap; }
        .stat-band { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:11px; }.stat-cell { min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:14px 16px;border:0;border-right:1px solid var(--border);background:transparent;color:var(--text);text-align:left;cursor:pointer; }.stat-cell:last-child { border-right:0; }.stat-label { display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:600; }.stat-icon { display:grid;color:var(--blue); }.stat-icon.stat-primary { color:var(--orange); }.stat-cell>b { color:var(--blue);font-size:30px;line-height:1; }.stat-cell small { color:var(--muted);font-size:10px; }.quick-section h2,.card-heading h2,.summary-card h2 { margin:0;color:var(--text);font-size:14px;font-weight:650; }.quick-section h2 { margin:0 0 10px; }.quick-grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px; }.quick-action { min-width:0;min-height:88px;display:flex;align-items:flex-start;gap:11px;padding:13px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);text-align:left;cursor:pointer;transition:color .16s,border-color .16s,background-color .16s; }.quick-action:hover { border-color:var(--blue); }.quick-action.quick-primary { border:1px solid var(--orange); }.quick-icon { display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:7px;background:#e7f5fa;color:var(--blue); }.quick-primary .quick-icon { background:#fff0e8;color:var(--orange); }.quick-action b,.quick-action small { display:block; }.quick-action b { font-size:12px; }.quick-action small { margin-top:5px;color:var(--muted);font-size:10px;line-height:1.45; }
        .recent-card,.rail-card { min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:10px; }.recent-card { flex:1;min-height:220px;display:flex;flex-direction:column;overflow:hidden; }.card-heading { min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border); }.text-link { padding:0;border:0;background:none;color:var(--orange-text);font:600 12px 'Public Sans',sans-serif;text-decoration:none;cursor:pointer; }.request-table-wrap { flex:1;min-height:0;overflow:auto; }.request-table { width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap; }.request-table th { position:sticky;top:0;z-index:1;padding:10px 12px;background:var(--page);color:var(--muted);text-align:left;font-size:10px;font-weight:600; }.request-table td { padding:11px 12px;border-top:1px solid var(--border); }.request-table td:first-child { min-width:150px; }.request-table td:first-child small { display:block;margin-top:4px;color:var(--muted);font-size:10px; }.tracking-number { font:500 12.5px 'JetBrains Mono',monospace; }.request-table tbody tr:hover { background:color-mix(in srgb,var(--page) 75%,var(--surface)); }.status-pill { display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid #c9dce7;border-radius:99px;background:#eef5f9;color:#26475a;font-size:10px; }.status-dot { width:7px;height:7px;fill:var(--blue);color:var(--blue); }.review-cell { text-align:right; }.table-empty { height:100px;text-align:center;color:var(--muted); }

}.issuance-empty { margin:auto;color:var(--muted);font-size:12px; }.summary-tiles { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:11px; }.summary-tiles>div { display:grid;gap:5px;padding:10px;border-radius:7px;background:var(--page); }.summary-tiles small { color:var(--muted);font-size:10px; }.summary-tiles b { color:var(--blue);font-size:25px;line-height:1; }
        :where(button,a,input,select,textarea):focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--orange)!important;outline-offset:2px; }.tab.active { color:var(--blue);border-color:var(--blue); }

        /* Staff header refinements */
        .staff-topbar { box-sizing:border-box;width:100%;height:64px;min-height:64px;gap:12px;padding:0 24px;padding-top:env(safe-area-inset-top,0px);background:#fff;border-bottom:1px solid #d9e8f0;box-shadow:none;backdrop-filter:none; }
