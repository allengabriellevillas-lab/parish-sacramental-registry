<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Parish Sacramental Registry System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Libre Franklin', 'sans-serif'],
                        serif: ['Source Serif 4', 'serif']
                    },
                    colors: {
                        ink: '#1a1f25',
                        navy: {
                            950: '#052c3b',
                            900: '#06455f',
                            800: '#008fbe',
                            700: '#13bde8'
                        },
                        slate2: {
                            700: '#33424f',
                            500: '#667887',
                            300: '#c7d4dc',
                            100: '#eaf7fc'
                        },
                        paper: '#f2fbff',
                        gold: {
                            700: '#b8440b',
                            600: '#f26a16',
                            400: '#ff9a3d',
                            100: '#fff0e3'
                        },
                        wine: {
                            700: '#990f14',
                            600: '#c9141b',
                            100: '#ffe5e6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Libre Franklin', sans-serif;
            background: #eefaff;
            color: #1a1f25;
        }

        .font-cert {
            font-family: 'Source Serif 4', serif;
        }

        /* Official diocesan seal used in the staff-workspace navigation. */
        a[href="/staff"] > span:first-child {
            background: #fff url('assets/diocese-of-dumaguete.jpg') center / cover no-repeat !important;
            color: transparent !important;
            font-size: 0 !important;
        }

        .field-label {
            font-size: 11px;
            letter-spacing: .02em;
            color: #667887;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            box-shadow: 0 0 0 3px #13bde844;
            border-color: #008fbe;
        }

        .tab.active {
            color: #008fbe;
            border-bottom: 2px solid #008fbe;
        }

        .seal {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ff9a3d, #f26a16 48%, #c9141b 72%);
            border: 3px solid #052c3b;
            display: grid;
            place-items: center;
            box-shadow: inset 0 0 0 4px #ffffff26;
        }

        .seal div {
            font: 11px/1.2 'Source Serif 4', serif;
            color: #1a1f25;
            text-align: center;
        }

        /* Staff sign-in screen. */
        .login-screen {
            min-height: 100vh;
            background: #fff;
        }

        .login-visual {
            min-height: 43vh;
            position: relative;
            overflow: hidden;
            background: #008fbe url('assets/9111fe70-fe2d-4e90-a610-68435670fdc4.jpg') center 42% / cover no-repeat;
        }

        .login-visual::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(5, 44, 59, .92), rgba(0, 143, 190, .55));
        }

        .login-visual-content {
            position: relative;
            z-index: 1;
        }

        .login-form-panel {
            min-height: 57vh;
        }

        .login-form-panel > div {
            max-width: 360px !important;
        }

        .login-form-panel > div > div:first-child > img,
        .login-form-panel > div > div:first-child > span {
            width: 76px;
            height: 76px;
        }

        .login-form-panel > div > div:first-child > span {
            display: none;
        }

        .login-form-panel > div > p:first-of-type,
        .login-form-panel label {
            font-size: 10px;
        }

        .login-form-panel form {
            margin-top: 1.75rem !important;
        }

        .login-input {
            height: 50px;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            font-size: 13px;
        }

        .login-input:focus {
            box-shadow: 0 0 0 3px rgba(19, 189, 232, .20);
            border-color: #008fbe;
        }

        .login-submit {
            background: #008fbe;
            box-shadow: 0 2px 5px rgba(5, 44, 59, .22);
        }

        .login-submit:hover,
        .login-submit:focus {
            background: #06455f;
        }

        .login-submit {
            font-size: 11px !important;
            padding-top: 14px !important;
            padding-bottom: 14px !important;
        }

        .login-form-panel > div > p:last-child {
            font-size: 9px;
        }

        /* Let the staff dashboard occupy all space beside the fixed sidebar. */
        #content {
            width: 100%;
            max-width: none !important;
        }

        @media (min-width: 768px) {
            .login-screen {
                display: grid;
                grid-template-columns: minmax(0, 2.2fr) minmax(360px, 1fr);
            }

            .login-visual,
            .login-form-panel {
                min-height: 100vh;
            }
        }

        .lucide {
            width: 1em;
            height: 1em;
        }

        @media print {
            body * {
                visibility: hidden;
            }

            #printCertificate,
            #printCertificate * {
                visibility: visible;
            }

            #printCertificate {
                position: absolute;
                inset: 0;
                width: 100%;
                margin: 0;
                border: 0;
                box-shadow: none;
            }

            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="app"></div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="ajax.js"></script>
    <script src="app.js"></script>
</body>
</html>
