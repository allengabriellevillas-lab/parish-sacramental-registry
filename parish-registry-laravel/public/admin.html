<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registry Administration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{color-scheme:light;--page:#eef8fc;--surface:#fff;--border:#d9e8f0;--blue:#0289bf;--blue-dark:#06455f;--orange:#f26a12;--orange-text:#c4560a;--text:#12222d;--muted:#5d7080}
        *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px 'Public Sans',sans-serif}button,input{font:inherit}button{cursor:pointer}
        .login-screen{min-height:100vh;background:#fff;display:grid;grid-template-columns:minmax(0,2.2fr) minmax(360px,1fr)}.login-visual{min-height:100vh;position:relative;display:flex;align-items:flex-end;overflow:hidden;background:var(--blue) url('assets/9111fe70-fe2d-4e90-a610-68435670fdc4.jpg') center 42%/cover no-repeat}.login-visual:before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,rgba(5,44,59,.92),rgba(0,143,190,.55))}.login-visual-content{position:relative;z-index:1;padding:42px;color:#fff}.login-kicker{display:inline-flex;border:1px solid #ffffff66;background:#0000001a;padding:6px 12px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}.login-visual h1{margin:18px 0 10px;font:600 clamp(38px,4vw,56px)/1.05 'Newsreader',serif}.login-visual p{max-width:440px;color:#ffffffdf;font-size:14px;line-height:1.7}.login-form-panel{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 34px}.login-form-inner{width:100%;max-width:360px}.login-brandmarks{display:flex;justify-content:center;gap:12px;margin-bottom:24px}.login-brandmarks img,.login-cross{width:76px;height:76px;border-radius:50%}.login-brandmarks img{object-fit:cover}.login-cross{display:grid;place-items:center;border:2px solid #fff0e3;background:#06455f;color:#ff9a3d;font:26px 'Newsreader',serif}.login-eyebrow{text-align:center;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}.login-form-panel h2{text-align:center;margin:8px 0 0;font:600 27px 'Newsreader',serif}.login-hint{text-align:center;color:var(--muted);font-size:12px;margin:8px 0 26px}.admin-login-form{display:grid;gap:17px}.admin-login-form label{display:grid;gap:7px;color:var(--text);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.admin-login-form input{height:50px;padding:0 13px;border:1px solid #e5e7eb;border-radius:4px;color:var(--text);font-size:13px;letter-spacing:normal;text-transform:none;outline:none}.admin-login-form input:focus{box-shadow:0 0 0 3px #13bde833;border-color:var(--blue)}.admin-login-submit{height:49px;border:0;border-radius:4px;background:var(--blue);box-shadow:0 2px 5px #052c3b38;color:white;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.admin-login-submit:hover{background:var(--blue-dark)}.admin-login-error{padding:11px;border:1px solid #c9141b44;border-radius:5px;background:#ffe5e6;color:#990f14;font-size:12px}.login-footer{text-align:center;margin-top:26px;color:var(--muted);font-size:9px;line-height:1.8}.login-back{display:block;margin-top:17px;text-align:center;color:var(--blue-dark);font-size:11px;font-weight:600;text-decoration:none}
        .staff-shell{min-height:100vh;display:grid;grid-template-columns:256px minmax(0,1fr);background:var(--page)}.staff-sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);z-index:3}.staff-brand{display:flex;align-items:center;gap:11px;padding:20px 17px;border-bottom:1px solid var(--border);color:var(--text);text-decoration:none}.staff-crest{width:38px;height:38px;display:grid;place-items:center;border:1px solid #f26a1680;border-radius:50%;background:#fff url('assets/diocese-of-dumaguete.jpg') center/cover no-repeat;color:transparent}.staff-brand b,.staff-brand small{display:block}.staff-brand b{font-size:14px}.staff-brand small{margin-top:3px;color:var(--muted);font-size:11px}.staff-nav{display:grid;gap:5px;padding:14px 12px}.staff-nav-link{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:8px;background:transparent;color:var(--text);text-align:left;font:600 13px 'Public Sans',sans-serif}.staff-nav-link:hover{background:var(--page)}.staff-nav-link:disabled{opacity:.48;cursor:not-allowed}.staff-nav-link.active{background:var(--blue);color:#fff}.staff-sidebar-bottom{margin-top:auto;padding:12px;border-top:1px solid var(--border)}.staff-workspace{min-width:0;min-height:100vh;display:flex;flex-direction:column}.staff-topbar{position:sticky;top:0;z-index:2;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 24px;background:#fff;border-bottom:1px solid var(--border)}.topbar-title{font-size:14px;font-weight:600}.admin-user{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}.admin-avatar{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#fff0e3;color:var(--orange-text);font-weight:700}.admin-logout{padding:8px 12px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);font-size:12px;font-weight:600}.admin-logout:hover{background:var(--page)}.staff-content{flex:1;min-width:0;padding:24px}.admin-welcome{padding:24px;border-radius:14px;background:var(--blue);color:white}.admin-welcome small{color:#dff5fc;font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.admin-welcome h1{margin:9px 0 6px;font:600 34px 'Newsreader',serif}.admin-welcome p{max-width:720px;margin:0;color:#f0faff;font-size:13px;line-height:1.7}.admin-section-title{margin:25px 0 12px;font-size:15px;font-weight:700}.admin-module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.admin-module{min-height:138px;padding:18px;border:1px solid var(--border);border-radius:11px;background:var(--surface)}.admin-module-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:#fff0e3;color:var(--orange-text);font-size:15px;font-weight:700}.admin-module h2{margin:14px 0 6px;font-size:13px;font-weight:700}.admin-module p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}.admin-module-note{display:block;margin-top:12px;color:var(--orange-text);font-size:10px;font-weight:600}
        .admin-icon{display:block;width:17px;height:17px;flex:0 0 17px}.admin-module-icon .admin-icon{width:19px;height:19px;flex-basis:19px}.admin-module-button{width:100%;color:inherit;text-align:left;font:inherit;cursor:pointer}.admin-module-button:hover{border-color:var(--blue)}.admin-page-heading{margin:4px 0 18px}.admin-page-heading h1{margin:0;font:600 30px 'Newsreader',serif}.admin-page-heading p{margin:6px 0 0;color:var(--muted);font-size:12px}.admin-panel{margin:12px 0;padding:18px;border:1px solid var(--border);border-radius:11px;background:var(--surface)}.admin-flash{padding:11px 13px;border-radius:7px;font-size:12px}.admin-flash.success{background:#e8f7ee;color:#146c3b}.admin-flash.error{background:#fff0ef;color:#a5251c}.admin-panel label{display:grid;gap:6px;color:var(--muted);font-size:11px;font-weight:600}.admin-panel input:not([type=checkbox]),.admin-panel select{width:100%;min-height:39px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);font:12px 'Public Sans',sans-serif}.admin-check{display:flex!important;align-items:center;gap:8px;padding:8px}.admin-button{padding:10px 14px;border:0;border-radius:6px;background:var(--blue);color:white;font-size:12px;font-weight:700;white-space:nowrap}.admin-button:hover{background:var(--blue-dark)}.admin-button.secondary{padding:7px 11px;border:1px solid var(--border);background:white;color:var(--text);font-size:11px}.admin-button.secondary:hover{background:var(--page)}.admin-create-form{display:grid;gap:14px}.admin-create-form h2{margin:0;font-size:15px}.admin-create-inline{display:flex;align-items:flex-end;gap:12px;max-width:720px}.admin-create-inline label{flex:1}.admin-table-wrap{overflow-x:auto}.admin-table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}.admin-table th{padding:11px;background:#f3f9fc;color:var(--muted);font-size:10px;text-transform:uppercase}.admin-table td{padding:12px 11px;border-top:1px solid var(--border);vertical-align:middle}.admin-table td small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.admin-table td:last-child{width:1%;white-space:nowrap}.admin-empty{padding:24px!important;text-align:center;color:var(--muted)}.admin-status{padding:4px 7px;border-radius:999px;font-size:10px;font-weight:700}.admin-status.is-active{background:#e8f7ee;color:#146c3b}.admin-status.is-inactive{background:#f1f3f5;color:#5d7080}.admin-inline-edit{display:grid;grid-template-columns:minmax(220px,1fr) auto auto;align-items:end;gap:16px;padding:8px 4px}.admin-inline-edit .admin-check{align-self:center}.admin-inline-actions{display:flex;gap:8px}.admin-system-list{margin:0}.admin-system-list>div{display:grid;grid-template-columns:200px 1fr;gap:15px;padding:13px 0;border-bottom:1px solid var(--border)}.admin-system-list dt{color:var(--muted);font-size:12px}.admin-system-list dd{margin:0;font-size:12px;font-weight:600}.admin-help{color:var(--muted);font-size:11px;line-height:1.6}
        .admin-page-heading{display:flex;align-items:center;justify-content:space-between;gap:18px}.admin-dialog{width:min(460px,calc(100% - 32px));padding:0;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text);box-shadow:0 24px 70px #12222d44}.admin-dialog::backdrop{background:#12222d88;backdrop-filter:blur(2px)}.admin-dialog form{display:grid;gap:12px;padding:22px}.admin-dialog-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}.admin-dialog-heading h2{margin:0;font-size:17px}.admin-dialog-heading p{margin:6px 0 0;color:var(--muted);font-size:12px}.admin-dialog-close{width:30px;height:30px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:22px;line-height:1}.admin-dialog-close:hover{background:var(--page)}.admin-dialog label{display:grid;gap:7px;font-size:12px;font-weight:600}.admin-dialog input,.admin-dialog select{height:42px;padding:9px 11px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);font:13px 'Public Sans',sans-serif}.admin-dialog input:focus,.admin-dialog select:focus{outline:2px solid #0289bf44;border-color:var(--blue)}.admin-dialog .admin-dialog-checkbox{display:flex;align-items:center;gap:9px;padding:8px 0}.admin-dialog .admin-dialog-checkbox input{width:17px;height:17px;margin:0;padding:0;accent-color:var(--blue)}.admin-dialog small{color:var(--muted);font-size:11px}.admin-dialog-error{margin:0;padding:9px;border-radius:6px;background:#fff0ef;color:#a5251c;font-size:12px}.admin-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
        @media(max-width:850px){.login-screen{grid-template-columns:1fr}.login-visual{min-height:34vh}.login-form-panel{min-height:66vh}.staff-shell{grid-template-columns:1fr}.staff-sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}.staff-brand{padding:10px 16px;border-bottom:0}.staff-crest{width:34px;height:34px}.staff-nav{display:flex;gap:5px;overflow-x:auto;padding:0 12px 10px}.staff-nav-link{width:auto;flex:none;padding:9px 11px;white-space:nowrap}.staff-sidebar-bottom{display:none}.staff-topbar{position:static}.staff-content{padding:16px}.admin-module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-inline-edit{grid-template-columns:1fr 1fr}.admin-inline-actions{grid-column:1/-1}.admin-create-inline{max-width:none}}
        @media(max-width:520px){.login-visual{min-height:28vh}.login-visual-content{padding:24px}.login-visual h1{font-size:35px}.login-form-panel{padding:32px 24px}.admin-module-grid{grid-template-columns:1fr}.staff-topbar{padding:0 14px}.admin-form-grid,.admin-inline-edit{grid-template-columns:1fr}.admin-inline-actions{grid-column:auto}.admin-create-inline{align-items:stretch;flex-direction:column}.admin-system-list>div{grid-template-columns:1fr;gap:5px}.admin-user>span:not(.admin-avatar){display:none}}
    </style>
</head>
<body>
    <main id="admin-app"></main>
    <script src="ajax.js"></script>
    <script src="admin.js"></script>
</body>
</html>
