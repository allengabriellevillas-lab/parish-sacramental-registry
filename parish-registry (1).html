<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parish Sacramental Registry System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<script>
  window.tailwind = window.tailwind || {};
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Libre Franklin', 'sans-serif'],
          serif: ['Source Serif 4', 'serif'],
        },
        colors: {
          ink: '#151b2b',
          navy: { 950:'#0b1220', 900:'#101a2e', 800:'#16223b', 700:'#1e2e4d', 600:'#2b3f66', 500:'#3d5788' },
          slate2: { 700:'#3f4a60', 500:'#64738c', 300:'#c3cbd9', 100:'#eceff4' },
          paper: '#f7f5f0',
          gold: { 700:'#8a6a24', 600:'#a9812f', 400:'#c9a04f', 100:'#f3e8d0' },
          wine: { 700:'#5e1f29', 600:'#7a2734', 100:'#f3e0e3' },
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Libre Franklin', sans-serif; background:#eef0f4; color:#151b2b; }
  .font-cert { font-family: 'Source Serif 4', serif; }
  ::selection { background:#c9a04f55; }
  .tab-underline { position:relative; }
  .tab-underline.active::after {
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:#c9a04f;
  }
  .seal {
    width:96px; height:96px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #d8b866, #a9812f 55%, #7a5b1d 100%);
    border: 3px solid #8a6a24;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 6px rgba(0,0,0,.25), inset 0 0 0 4px rgba(255,255,255,.15);
  }
  .seal-inner { font-family:'Source Serif 4', serif; color:#3a2c0c; font-size:11px; text-align:center; line-height:1.2; letter-spacing:.03em; }
  .field-label { font-size:11px; letter-spacing:.02em; color:#64738c; font-weight:600; }
  input, select, textarea { outline: none; }
  input:focus, select:focus, textarea:focus { box-shadow: 0 0 0 3px #c9a04f55; border-color:#a9812f; }
  .status-dot { width:7px; height:7px; border-radius:9999px; display:inline-block; }
  .scrollbar-thin::-webkit-scrollbar{height:6px; width:6px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:#c3cbd9; border-radius:9999px;}

  @media print {
    body * { visibility: hidden; }
    #printCertificate, #printCertificate * { visibility: visible; }
    #printCertificate { position: absolute; top:0; left:0; width:100%; margin:0; padding:0; box-shadow:none; border:none; }
    .no-print { display:none !important; }
  }
</style>
</head>
<body class="min-h-screen">

<div id="app"></div>

<script>
/* ============================================================
   MOCK DATABASE — mirrors persons / sacramental_records /
   certificate_issuance_logs schema (flattened for the demo)
============================================================ */
let records = [
  {
    id: 1, sacrament: 'Baptism', firstName:'Maria', middleName:'Clara', lastName:'Santos',
    gender:'Female', dob:'1998-03-12', eventDate:'1998-04-19',

  },

    fatherName:'Enrico Dela Cruz', motherName:'Liwayway Ramos',
    book:'7', page:'12', line:'8',
    minister:'Most Rev. Bishop Ignacio Villaverde', sponsors:'Marco Villanueva',
    marginNotes:'', spouse:null
  },
  {

    fatherName:'Alfonso Fernandez', motherName:'Corazon Lim',
    book:'3', page:'88', line:'1',
    minister:'Rev. Fr. Anthony Cruz', sponsors:'Witnesses: Rico Santos & Elena Cruz',
    marginNotes:'Convalidated per diocesan decree, 2011.',
    spouse:'Josefa Marquez Ramos'
  },
  {
    id: 4, sacrament: 'Communion', firstName:'Ana', middleName:'Liza', lastName:'Reyes',
    gender:'Female', dob:'2007-08-09', eventDate:'2014-05-04',

  },
  {
    id: 5, sacrament: 'Death', firstName:'Roberto', middleName:'Ignacio', lastName:'Fernandez',
    gender:'Male', dob:'1940-02-17', eventDate:'2019-09-02',
    fatherName:'Alfonso Fernandez', motherName:'Corazon Lim',
    book:'2', page:'5', line:'12',
    minister:'Rev. Fr. Benedict Ong', sponsors:'—',
    marginNotes:'Interred at Parish Cemetery, Lot 45.', spouse:null
  },
  {
    id: 6, sacrament: 'Baptism', firstName:'Sofia', middleName:'Amor', lastName:'Bautista',
    gender:'Female', dob:'2021-12-01', eventDate:'2022-01-16',
    fatherName:'Michael Bautista', motherName:'Grace Villanueva',
    book:'14', page:'3', line:'19',
    minister:'Rev. Fr. Benedict Ong', sponsors:'Carlo Reyes & Nina Torres',
    marginNotes:'', spouse:null
  },
];

let auditLogs = [
  { id:1, personName:'Maria Clara Santos', sacrament:'Baptism', issuedTo:'Maria Clara Santos', purpose:'School Requirement', issuedBy:'Parish Staff', timestamp:'2026-08-02 09:14' },
  { id:2, personName:'Juan Miguel Dela Cruz', sacrament:'Confirmation', issuedTo:'Juan Miguel Dela Cruz', purpose:'Marriage Preparation', issuedBy:'Parish Staff', timestamp:'2026-08-21 14:02' },
];

let nextRecordId = 7;
let nextLogId = 3;

/* ============================================================
   APP STATE
============================================================ */
let state = {
  tab: 'search',
  searchQuery: '',
  modal: null,        // 'issue' | 'print' | null
  activeRecord: null,
  requestor: '',
  purpose: 'Personal Record',
  stagedRows: [],
  rapid: {
    book: '1', line: '1'
  }
};

function render() {
  const root = document.getElementById('app');
  root.innerHTML = `
    ${TopNav()}
    <main class="max-w-7xl mx-auto px-6 py-8 no-print">
      ${state.tab === 'search' ? SearchTab() : ''}
      ${state.tab === 'bulk' ? BulkTab() : ''}
      ${state.tab === 'rapid' ? RapidTab() : ''}
      ${state.tab === 'audit' ? AuditTab() : ''}
    </main>
    ${state.modal === 'issue' ? IssueModal() : ''}
    ${state.modal === 'print' ? PrintModal() : ''}
  `;
  attachHandlers();
}

/* ============================================================
   TOP NAV
============================================================ */
function TopNav() {
  const tabs = [
    { id:'search', label:'Search & Print Certificates' },
    { id:'bulk', label:'Bulk Data Ingestion' },
    { id:'rapid', label:'Rapid Data Entry' },
    { id:'audit', label:'Issuance Audit Logs' },
  ];
  return `
  <header class="bg-navy-950 border-b border-navy-700 no-print">
    <div class="max-w-7xl mx-auto px-6 pt-5 pb-0">
      <div class="flex items-center justify-between mb-5">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full border border-gold-400/60 flex items-center justify-center text-gold-400 font-cert text-sm">✝</div>
          <div>
            <h1 class="text-slate-50 text-lg font-semibold tracking-tight leading-none">Parish Sacramental Registry System</h1>
            <p class="text-navy-300/70 text-xs mt-1" style="color:#8fa0c2">Diocesan Record &amp; Certification Office</p>
          </div>
        </div>
        <div class="flex items-center gap-2 text-sm">
          <span class="w-2 h-2 rounded-full bg-green-400"></span>
          <span style="color:#c3cbd9">Logged in as: <span class="text-slate-50 font-medium">Parish Staff</span></span>
        </div>
      </div>
      <nav class="flex gap-7 text-sm">
        ${tabs.map(t => `
          <button data-tab="${t.id}" class="tab-underline ${state.tab===t.id?'active text-gold-400':'text-slate-300 hover:text-slate-100'} pb-3 font-medium transition-colors">
            ${t.label}
          </button>
        `).join('')}
      </nav>
    </div>
  </header>`;
}

/* ============================================================
   TAB 1 — SEARCH & PRINT
============================================================ */
function filteredRecords() {
  const q = state.searchQuery.trim().toLowerCase();
  if (!q) return records;
  return records.filter(r => {
    const hay = [
      r.firstName, r.middleName, r.lastName, r.dob, r.sacrament,
      r.book, r.page, r.line, `${r.book}/${r.page}/${r.line}`
    ].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function sacramentBadge(s) {
  const map = {
    Baptism:'bg-navy-600/10 text-navy-700 border-navy-600/30',
    Confirmation:'bg-gold-100 text-gold-700 border-gold-400/50',
    Marriage:'bg-wine-100 text-wine-700 border-wine-600/30',
    Communion:'bg-slate2-100 text-slate2-700 border-slate2-300',
    Death:'bg-slate-200 text-slate-600 border-slate-300',
  };
  return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold border ${map[s]||''}">${s}</span>`;
}

function SearchTab() {
  const rows = filteredRecords();
  return `
  <section>
    <div class="flex items-center justify-between mb-5">
      <div>
        <h2 class="text-xl font-semibold text-ink">Search Sacramental Records</h2>
        <p class="text-sm text-slate2-500 mt-0.5">Look up by name, date of birth, sacrament type, or book/page/line reference.</p>
      </div>
    </div>

    <div class="bg-white border border-slate2-300/70 rounded-lg p-4 mb-5 shadow-sm">
      <div class="relative">
        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate2-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
        <input id="searchInput" type="text" value="${state.searchQuery}" placeholder="Search e.g. &quot;Santos&quot;, &quot;1998-03-12&quot;, &quot;Baptism&quot;, &quot;12/45&quot;..."
          class="w-full border border-slate2-300 rounded-md pl-9 pr-3 py-2.5 text-sm bg-paper focus:bg-white" />
      </div>
    </div>

    <div class="bg-white border border-slate2-300/70 rounded-lg shadow-sm overflow-hidden">
      <div class="overflow-x-auto scrollbar-thin">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-navy-900 text-slate-200 text-left">
              <th class="px-4 py-3 font-semibold text-xs tracking-wide">Name</th>
              <th class="px-4 py-3 font-semibold text-xs tracking-wide">Sacrament</th>
              <th class="px-4 py-3 font-semibold text-xs tracking-wide">Event Date</th>
              <th class="px-4 py-3 font-semibold text-xs tracking-wide">Book / Page / Line</th>
              <th class="px-4 py-3 font-semibold text-xs tracking-wide text-right">Action</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate2-100">
            ${rows.map(r => `
              <tr class="hover:bg-paper/70 transition-colors">
                <td class="px-4 py-3">
                  <div class="font-medium text-ink">${r.firstName} ${r.middleName?r.middleName+' ':''}${r.lastName}</div>
                  <div class="text-xs text-slate2-500">DOB ${formatDate(r.dob)}${r.spouse?' · m. '+r.spouse:''}</div>
                </td>
                <td class="px-4 py-3">${sacramentBadge(r.sacrament)}</td>
                <td class="px-4 py-3 text-ink">${formatDate(r.eventDate)}</td>
                <td class="px-4 py-3 font-mono text-xs text-slate2-700">Bk ${r.book} / Pg ${r.page} / Ln ${r.line}</td>
                <td class="px-4 py-3 text-right">
                  <button data-issue="${r.id}" class="px-3 py-1.5 rounded-md bg-navy-800 hover:bg-navy-700 text-white text-xs font-semibold transition-colors">
                    Issue Certificate
                  </button>
                </td>
              </tr>
            `).join('') || `<tr><td colspan="5" class="px-4 py-10 text-center text-slate2-500">No records match your search.</td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="px-4 py-2.5 bg-paper border-t border-slate2-200 text-xs text-slate2-500">${rows.length} of ${records.length} record${records.length===1?'':'s'} shown</div>
    </div>
  </section>`;
}

/* ============================================================
   ISSUANCE MODAL
============================================================ */
function IssueModal() {
  const r = state.activeRecord;
  return `
  <div class="fixed inset-0 bg-ink/60 flex items-center justify-center z-40 px-4 no-print">
    <div class="bg-white rounded-lg shadow-2xl w-full max-w-md">
      <div class="px-6 py-4 border-b border-slate2-200 flex items-center justify-between">
        <h3 class="font-semibold text-ink">Issue Certificate</h3>
        <button data-close-modal class="text-slate2-500 hover:text-ink">✕</button>
      </div>
      <div class="px-6 py-5 space-y-4">
        <div class="bg-paper rounded-md px-3 py-2.5 border border-slate2-200">
          <p class="text-sm font-medium text-ink">${r.firstName} ${r.middleName||''} ${r.lastName}</p>
          <p class="text-xs text-slate2-500 mt-0.5">${r.sacrament} · Bk ${r.book}/Pg ${r.page}/Ln ${r.line}</p>
        </div>
        <div>
          <label class="field-label block mb-1">Requestor Name</label>
          <input id="requestorInput" type="text" placeholder="Full name of person requesting"
            value="${state.requestor}" class="w-full border border-slate2-300 rounded-md px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="field-label block mb-1">Purpose of Issuance</label>
          <select id="purposeInput" class="w-full border border-slate2-300 rounded-md px-3 py-2 text-sm bg-white">
            ${['Marriage Preparation','School Requirement','Personal Record','Employment','Travel/Passport','Other'].map(p =>
              `<option value="${p}" ${state.purpose===p?'selected':''}>${p}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="px-6 py-4 border-t border-slate2-200 flex justify-end gap-2">
        <button data-close-modal class="px-4 py-2 text-sm font-medium text-slate2-700 hover:bg-paper rounded-md">Cancel</button>
        <button id="previewBtn" class="px-4 py-2 text-sm font-semibold bg-gold-600 hover:bg-gold-700 text-white rounded-md transition-colors">Print Preview</button>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   PRINT / PREVIEW MODAL
============================================================ */
function fullName(r){ return `${r.firstName} ${r.middleName?r.middleName+' ':''}${r.lastName}`; }

function certificateTitle(s) {
  return {
    Baptism:'Certificate of Baptism',
    Confirmation:'Certificate of Confirmation',
    Marriage:'Certificate of Marriage',
    Communion:'Certificate of First Holy Communion',
    Death:'Certificate of Death',
  }[s] || 'Sacramental Certificate';
}

function certificateBody(r) {
  const name = fullName(r);
  if (r.sacrament === 'Marriage') {
    return `This is to certify that <strong>${name}</strong> and <strong>${r.spouse}</strong> were joined in Holy Matrimony
      according to the rites of the Roman Catholic Church on <strong>${formatDate(r.eventDate)}</strong>,
      as attested by the Sacramental Registers of this Parish.`;
  }
  if (r.sacrament === 'Death') {
    return `This is to certify that <strong>${name}</strong>, born on <strong>${formatDate(r.dob)}</strong> to
      <strong>${r.fatherName}</strong> and <strong>${r.motherName}</strong>, departed this life on
      <strong>${formatDate(r.eventDate)}</strong> and was given ecclesiastical rites according to the Roman Catholic Church.`;
  }
  return `This is to certify that <strong>${name}</strong>, born on <strong>${formatDate(r.dob)}</strong> to
    <strong>${r.fatherName}</strong> and <strong>${r.motherName}</strong>, received the Sacrament of
    <strong>${r.sacrament}</strong> in this Parish on <strong>${formatDate(r.eventDate)}</strong>,
    according to the Rites of the Roman Catholic Church.`;
}

function PrintModal() {
  const r = state.activeRecord;
  const today = new Date();
  const todayStr = today.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
  return `
  <div class="fixed inset-0 bg-ink/70 flex items-start md:items-center justify-center z-50 px-4 py-8 overflow-y-auto no-print">
    <div class="w-full max-w-3xl">
      <div class="flex justify-end gap-2 mb-3 no-print">
        <button data-close-modal class="px-4 py-2 text-sm rounded-md bg-navy-800 hover:bg-navy-700 text-white font-medium">Close</button>
        <button id="printNowBtn" class="px-4 py-2 text-sm rounded-md bg-gold-600 hover:bg-gold-700 text-white font-semibold">Print Certificate</button>
      </div>

      <div id="printCertificate" class="bg-white shadow-2xl mx-auto" style="width:100%; max-width:720px; padding:56px 60px; border:1px solid #d8d2c2;">
        <div class="text-center mb-6" style="border-bottom:2px solid #a9812f; padding-bottom:18px;">
          <p class="font-cert text-xs tracking-wide" style="color:#7a2734;">DIOCESE OF SAN ILDEFONSO</p>
          <h2 class="font-cert text-2xl font-semibold mt-1" style="color:#151b2b;">Parish of Our Lady of the Assumption</h2>
          <p class="font-cert text-xs mt-1" style="color:#64738c;">Cebu City, Philippines · Est. 1854</p>
        </div>

        <div class="flex justify-center mb-5">
          <div class="seal"><div class="seal-inner">PARISH<br>SEAL</div></div>
        </div>

        <h3 class="text-center font-cert text-xl font-semibold mb-6 tracking-wide" style="color:#151b2b;">${certificateTitle(r.sacrament)}</h3>

        <p class="font-cert text-[15px] leading-8 text-justify" style="color:#1c2431;">
          ${certificateBody(r)}
        </p>

        <div class="grid grid-cols-3 gap-3 my-7 font-cert text-sm" style="border-top:1px solid #d8d2c2; border-bottom:1px solid #d8d2c2; padding:14px 0;">
          <div><span class="block text-xs" style="color:#64738c;">Book No.</span><span class="font-semibold">${r.book}</span></div>
          <div><span class="block text-xs" style="color:#64738c;">Page No.</span><span class="font-semibold">${r.page}</span></div>
          <div><span class="block text-xs" style="color:#64738c;">Line Entry No.</span><span class="font-semibold">${r.line}</span></div>
        </div>

        ${r.marginNotes ? `
        <div class="mb-6 font-cert text-sm" style="background:#f3e0e3; border-left:3px solid #7a2734; padding:10px 14px;">
          <span class="block text-xs font-semibold mb-0.5" style="color:#5e1f29;">CANONICAL MARGIN NOTES</span>
          <span style="color:#3a1015;">${r.marginNotes}</span>
        </div>` : ''}

        <div class="flex items-end justify-between mt-14 font-cert text-sm">
          <div>
            <div style="border-top:1px solid #151b2b; width:220px; margin-bottom:6px;"></div>
            <p class="font-semibold">${r.minister}</p>
            <p class="text-xs" style="color:#64738c;">Officiating Priest / Parish Priest</p>
          </div>
          <div class="text-right">
            <div style="border-top:1px solid #151b2b; width:160px; margin-bottom:6px; margin-left:auto;"></div>
            <p class="text-xs" style="color:#64738c;">Date Issued</p>
            <p class="font-semibold">${todayStr}</p>
          </div>
        </div>

        <p class="text-center font-cert text-xs mt-10 pt-4" style="border-top:1px dashed #c3cbd9; color:#64738c;">
          Issued to <strong style="color:#151b2b;">${state.requestor || '____________________'}</strong>
          for the purpose of <strong style="color:#151b2b;">${state.purpose}</strong>.
          Not valid without the parish dry seal.
        </p>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   TAB 2 — BULK DATA INGESTION
============================================================ */
function statusForRow(row) {
  if (!row.fatherName || row.fatherName.trim()==='') return { label:'Missing Father Name', ok:false };
  if (!row.motherName || row.motherName.trim()==='') return { label:'Missing Mother Name', ok:false };
  if (!row.firstName || !row.lastName) return { label:'Missing Name', ok:false };
  if (!row.sacrament) return { label:'Missing Sacrament Type', ok:false };
  return { label:'Valid', ok:true };
}

function BulkTab() {
  const staged = state.stagedRows;
  const validCount = staged.filter(r => statusForRow(r).ok).length;
  return `
  <section>
    <h2 class="text-xl font-semibold text-ink mb-1">Bulk Data Ingestion</h2>
    <p class="text-sm text-slate2-500 mb-5">Upload a CSV export of scanned register books for batch review before committing to the registry.</p>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6">
      <div id="dropzone" class="md:col-span-2 border-2 border-dashed border-slate2-300 rounded-lg bg-white flex flex-col items-center justify-center py-12 px-6 text-center transition-colors hover:border-gold-400">
        <svg class="w-9 h-9 text-slate2-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.9A5.5 5.5 0 0117 6.5a4.5 4.5 0 011 8.9M12 12v9m0-9l-3 3m3-3l3 3"/></svg>
        <p class="text-sm font-medium text-ink">Drag & drop your CSV file here</p>
        <p class="text-xs text-slate2-500 mt-1 mb-3">or click to browse from your computer</p>
        <input type="file" id="csvInput" accept=".csv" class="hidden" />
        <button id="browseBtn" class="px-4 py-2 rounded-md bg-navy-800 hover:bg-navy-700 text-white text-sm font-semibold">Choose File</button>
      </div>
      <div class="bg-white border border-slate2-300/70 rounded-lg p-5">
        <p class="text-sm font-semibold text-ink mb-2">Need the format?</p>
        <p class="text-xs text-slate2-500 mb-4">Download the template with the exact columns the parser expects.</p>
        <a id="downloadTemplate" href="#" class="inline-flex items-center gap-1.5 text-sm font-semibold text-gold-700 hover:text-gold-600">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/></svg>
          Download CSV Template
        </a>
      </div>
    </div>

    ${staged.length ? `
    <div class="bg-white border border-slate2-300/70 rounded-lg shadow-sm overflow-hidden mb-5">

                <td class="px-4 py-2.5 text-ink">${row.firstName||'—'} ${row.lastName||''}</td>

                <td class="px-4 py-2.5 font-mono text-xs text-slate2-700">${row.book||'—'}/${row.page||'—'}/${row.line||'—'}</td>
                <td class="px-4 py-2.5">
                  <span class="inline-flex items-center gap-1.5 text-xs font-semibold ${s.ok?'text-green-700':'text-wine-700'}">

                  </span>
                </td>

            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="px-4 py-3 bg-paper border-t border-slate2-200 flex items-center justify-between">

        <div class="flex gap-2">

}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if (!lines.length) return [];
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const cells = line.split(',').map(c => c.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = cells[i] || '');
    return {
      sacrament: obj.sacrament || obj.Sacrament || '',
      firstName: obj.firstName || obj.first_name || '',
      middleName: obj.middleName || obj.middle_name || '',
      lastName: obj.lastName || obj.last_name || '',
      gender: obj.gender || '',
      dob: obj.dob || obj.date_of_birth || '',
      eventDate: obj.eventDate || obj.event_date || '',
      fatherName: obj.fatherName || obj.father_name || '',
      motherName: obj.motherName || obj.mother_name || '',
      book: obj.book || '', page: obj.page || '', line: obj.line || '',
      minister: obj.minister || '', sponsors: obj.sponsors || '', marginNotes: obj.marginNotes || ''
    };
  });
}

/* ============================================================
   HELPERS
============================================================ */
function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
}

function nowStamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ============================================================
   EVENT HANDLERS
============================================================ */
function attachHandlers() {
  // Nav tabs
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => { state.tab = btn.dataset.tab; render(); });
  });

  // ---- Search tab ----
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', e => {
      state.searchQuery = e.target.value;
      render();
      // restore focus + cursor position after re-render
      const el = document.getElementById('searchInput');
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    });
  }
  document.querySelectorAll('[data-issue]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.issue);
      state.activeRecord = records.find(r => r.id === id);
      state.requestor = '';
      state.purpose = 'Personal Record';
      state.modal = 'issue';
      render();
    });
  });

  // ---- Modals ----
  document.querySelectorAll('[data-close-modal]').forEach(btn => {
    btn.addEventListener('click', () => { state.modal = null; render(); });
  });
  const requestorInput = document.getElementById('requestorInput');
  if (requestorInput) requestorInput.addEventListener('input', e => state.requestor = e.target.value);
  const purposeInput = document.getElementById('purposeInput');
  if (purposeInput) purposeInput.addEventListener('change', e => state.purpose = e.target.value);

  const previewBtn = document.getElementById('previewBtn');
  if (previewBtn) previewBtn.addEventListener('click', () => {
    state.modal = 'print';
    render();
  });

  const printNowBtn = document.getElementById('printNowBtn');
  if (printNowBtn) printNowBtn.addEventListener('click', () => {
    const r = state.activeRecord;
    auditLogs.push({
      id: nextLogId++,
      personName: fullName(r),
      sacrament: r.sacrament,
      issuedTo: state.requestor || fullName(r),
      purpose: state.purpose,
      issuedBy: 'Parish Staff',
      timestamp: nowStamp()
    });
    window.print();
  });

  // ---- Bulk tab ----
  const dropzone = document.getElementById('dropzone');
  const csvInput = document.getElementById('csvInput');
  const browseBtn = document.getElementById('browseBtn');
  if (browseBtn) browseBtn.addEventListener('click', () => csvInput.click());
  if (csvInput) csvInput.addEventListener('change', e => handleCSVFile(e.target.files[0]));
  if (dropzone) {
    ['dragover','dragenter'].forEach(evt => dropzone.addEventListener(evt, e => {
      e.preventDefault(); dropzone.classList.add('border-gold-500','bg-gold-100/30');
    }));
    ['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, e => {
      e.preventDefault(); dropzone.classList.remove('border-gold-500','bg-gold-100/30');
    }));
    dropzone.addEventListener('drop', e => {
      const file = e.dataTransfer.files[0];
      if (file) handleCSVFile(file);
    });
    dropzone.addEventListener('click', (e) => { if (e.target === dropzone) csvInput.click(); });
  }
  const downloadTemplate = document.getElementById('downloadTemplate');
  if (downloadTemplate) downloadTemplate.addEventListener('click', e => {
    e.preventDefault();
    const blob = new Blob([CSV_TEMPLATE], { type:'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'parish_registry_template.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  const clearStaged = document.getElementById('clearStaged');
  if (clearStaged) clearStaged.addEventListener('click', () => { state.stagedRows = []; render(); });
  const commitBtn = document.getElementById('commitBtn');
  if (commitBtn) commitBtn.addEventListener('click', () => {
    const valid = state.stagedRows.filter(r => statusForRow(r).ok);
    valid.forEach(row => {
      records.push({ id: nextRecordId++, spouse:null, ...row });
    });
    const count = valid.length;
    state.stagedRows = state.stagedRows.filter(r => !statusForRow(r).ok);
    alert(`${count} record${count===1?'':'s'} committed to the database successfully.`);
    render();
  });

  // ---- Rapid entry tab ----
  const rapidForm = document.getElementById('rapidForm');
  if (rapidForm) {
    rapidForm.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        rapidForm.requestSubmit();
      }
    });
    rapidForm.addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(rapidForm);
      const row = Object.fromEntries(fd.entries());
      if (!row.firstName || !row.lastName) {
        showRapidToast('Enter at least a first and last name before saving.', false);
        return;
      }
      records.push({
        id: nextRecordId++,
        sacrament: row.sacrament, firstName: row.firstName, middleName: row.middleName,
        lastName: row.lastName, gender: row.gender, dob: row.dob, eventDate: row.eventDate,
        fatherName: row.fatherName, motherName: row.motherName,
        book: row.book, page: row.page, line: row.line,
        minister: row.minister, sponsors: row.sponsors, marginNotes: row.marginNotes,
        spouse: null
      });
      // auto-increment line, keep book unless it's blank
      state.rapid.book = row.book || state.rapid.book;
      state.rapid.line = String(Number(row.line || 0) + 1);
      showRapidToast(`Saved: ${row.firstName} ${row.lastName} — Bk ${row.book}/Ln ${row.line}. Ready for next entry.`, true);
      render();
      const firstField = document.querySelector('#rapidForm input[name="firstName"]');
      if (firstField) firstField.focus();
    });
  }
}

function showRapidToast(msg, ok) {
  // render() will wipe DOM, so stash message to show post-render
  window.__toastMsg = msg;
  window.__toastOk = ok;
}

const _origRender = render;
render = function() {
  _origRender();
  if (window.__toastMsg) {
    const t = document.getElementById('rapidToast');
    if (t) {
      t.textContent = window.__toastMsg;
      t.className = `mt-4 px-4 py-3 rounded-md text-sm font-medium border ${window.__toastOk ? 'bg-green-50 border-green-200 text-green-800' : 'bg-wine-100 border-wine-600/30 text-wine-700'}`;
      window.__toastMsg = null;
    }
  }
};

function handleCSVFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const parsed = parseCSV(e.target.result);
    state.stagedRows = parsed;
    render();
  };
  reader.readAsText(file);
}

render();
</script>
